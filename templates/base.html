{% load static tailwind_cli %}<!doctype html>
<html lang="en-nz">
<head>
  <meta charset="utf-8">
  {# No maximum-scale: it would block pinch-zoom, which low-vision users rely on. #}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StockRoom{% endblock %}</title>
  {% block meta %}{% endblock %}

  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <meta name="theme-color" content="#5980a6">
  <link rel="icon" type="image/svg+xml" href="{% static 'icons/icon.svg' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StockRoom">

  {% tailwind_css %}
  {# Under the CSP: no eval (so no hx-on or js: values), and no injected <style>. #}
  <meta name="htmx-config" content='{"allowEval": false, "includeIndicatorStyles": false}'>
  <script src="{% static 'vendor/htmx.min.js' %}"></script>
</head>
<body class="min-h-screen bg-app-bg text-gray-900"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

  <div id="toast-slot" x-data="toastHub" @toast.window="add"
       class="pointer-events-none fixed inset-x-0 top-0 z-50 flex flex-col items-center gap-2 p-3"
       aria-live="polite">
    {% for message in messages %}
      <div x-data="flash" x-show="show"
           class="pointer-events-auto flex min-h-14 w-full max-w-md items-center gap-3 bg-gray-900 py-1 pr-1 pl-4 text-white shadow-lg">
        <span class="flex-1">{{ message }}</span>
        {% if message.extra_tags %}
          <button type="button" hx-post="{{ message.extra_tags }}" hx-swap="none" hx-disabled-elt="this"
                  class="btn border-white/45 text-white" @click="hide">Undo</button>
        {% endif %}
        <button type="button" class="tap-target text-xl text-white/70" @click="hide" aria-label="Dismiss">&times;</button>
      </div>
    {% endfor %}
    <template x-for="item in items" :key="item.id">
      <div class="pointer-events-auto flex min-h-14 w-full max-w-md items-center gap-3 bg-gray-900 py-1 pr-1 pl-4 text-white shadow-lg">
        <span class="flex-1" x-text="item.message"></span>
        <button type="button" class="tap-target text-xl text-white/70" @click="dismiss" aria-label="Dismiss">&times;</button>
      </div>
    </template>
    <button type="button" id="sw-update" hidden
            class="btn pointer-events-auto border-gray-900 bg-gray-900 text-white shadow-lg">New version available, tap to reload</button>
  </div>

  <div id="ios-install-hint" hidden
       class="fixed inset-x-3 {% if user.is_authenticated %}bottom-20{% else %}bottom-3{% endif %} z-40 mx-auto flex max-w-md items-center gap-3 bg-gray-900 py-1 pr-1 pl-4 text-sm text-white shadow-lg">
    <span class="flex-1">Install StockRoom: tap Share, then "Add to Home Screen".</span>
    <button type="button" id="ios-install-hint-dismiss" class="tap-target text-xl text-white/70" aria-label="Dismiss">&times;</button>
  </div>

  {% if user.is_authenticated %}
    {% if not user.is_practice_login %}
      {# Shared by the header's desktop nav row and the phone's bottom tab bar. #}
      {% url 'stock:home' as url_home %}
      {% url 'stock:log_usage' as url_log_usage %}
      {% url 'stock:reorder_list' as url_reorder_list %}
      {% url 'stock:deliveries' as url_deliveries %}
      {% url 'stock:items' as url_items %}
      {% url 'stock:stocktake_step' as url_stocktake %}
      {% url 'stock:suppliers' as url_suppliers %}
      {% url 'stock:spending' as url_spending %}
      {% url 'stock:activity_log' as url_activity %}
      {% url 'stock:tax_year' as url_tax %}
      {% url 'team' as url_team %}
      {% url 'stock:setup' as url_setup %}
    {% endif %}
    <header class="sticky top-0 z-30 border-b border-gray-300 bg-app-bg">
      <div class="mx-auto flex h-16 max-w-md items-center gap-2 px-4 lg:max-w-3xl lg:px-6">
        <button type="button" class="tap-target -ml-2 grid shrink-0 place-items-center"
                data-open-dialog="about" aria-label="About StockRoom">
          <span class="grid size-8 place-items-center rounded-full border-[1.5px] border-primary font-heading text-sm font-semibold text-primary-dark">i</span>
        </button>
        <p class="min-w-0 flex-1 truncate font-heading text-lg font-semibold tracking-[0.06em] uppercase">{{ user.organisation|default:"StockRoom" }}</p>
        {% if ai_enabled and not user.is_practice_login %}
          {% url 'assistant:ask' as url_ask %}
          <a href="{{ url_ask }}" class="btn btn-line shrink-0 px-3" {% if request.path == url_ask %}aria-current="page"{% endif %}>Ask</a>
        {% endif %}
        {% if user.is_practice_login %}
          {# The practice login alone: no one has entered a code yet. #}
          <form method="post" action="{% url 'logout' %}" class="shrink-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-line">Log out</button>
          </form>
        {% else %}
          <div class="relative shrink-0" x-data="dropdown" @click.outside="close">
            <button type="button" class="btn btn-line max-w-40 flex-col items-start gap-1 px-3 text-left leading-none"
                    @click="toggle" :aria-expanded="open" aria-haspopup="true" aria-label="Signed in as {{ user.name|default:user.email }}, {{ user.get_role_display }}">
              <span class="max-w-full truncate">{{ user.name|default:user.email }}</span>
              <span class="font-sans text-[0.6875rem] font-semibold tracking-[0.06em] text-gray-600 uppercase">{% if user.is_org_admin %}Manager{% else %}Assistant{% endif %}</span>
            </button>
            <div x-show="open" x-cloak class="absolute top-full right-0 mt-1 w-56 border border-gray-300 bg-app-bg py-1 shadow-lg">
              {% if user.pin %}
                <a href="{% url 'enter_code' %}" class="menu-item">Switch person</a>
              {% else %}
                <a href="{% url 'password_change' %}" class="menu-item">Change password</a>
              {% endif %}
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="menu-item">{% if user.pin %}Log this device out{% else %}Log out{% endif %}</button>
              </form>
            </div>
          </div>
        {% endif %}
      </div>
      {% if not user.is_practice_login %}
        {# The phone's bottom tab bar becomes a normal nav row once there's room for one. #}
        <nav class="hidden border-t border-gray-200 lg:block" aria-label="Main">
          <div class="mx-auto flex max-w-3xl flex-wrap items-center gap-x-5 gap-y-1 px-6 py-2">
            <a href="{{ url_home }}" class="nav-link" {% if request.path == url_home %}aria-current="page"{% endif %}>Home</a>
            <a href="{{ url_log_usage }}" class="nav-link" {% if request.path == url_log_usage %}aria-current="page"{% endif %}>Log usage</a>
            <a href="{{ url_reorder_list }}" class="nav-link" {% if request.path == url_reorder_list %}aria-current="page"{% endif %}>Reorder list</a>
            <a href="{{ url_deliveries }}" class="nav-link" {% if request.path == url_deliveries %}aria-current="page"{% endif %}>Deliveries</a>
            {% if user.is_org_admin %}
              <span class="h-5 w-px shrink-0 bg-gray-300" aria-hidden="true"></span>
              <a href="{{ url_items }}" class="nav-link" {% if url_items in request.path or url_stocktake in request.path %}aria-current="page"{% endif %}>Stock</a>
              <a href="{{ url_suppliers }}" class="nav-link" {% if url_suppliers in request.path %}aria-current="page"{% endif %}>Suppliers</a>
              <a href="{{ url_spending }}" class="nav-link" {% if url_spending in request.path %}aria-current="page"{% endif %}>Spending</a>
              <a href="{{ url_tax }}" class="nav-link" {% if url_tax in request.path %}aria-current="page"{% endif %}>Tax</a>
              <a href="{{ url_activity }}" class="nav-link" {% if url_activity in request.path %}aria-current="page"{% endif %}>Activity</a>
              <a href="{{ url_team }}" class="nav-link" {% if url_team in request.path %}aria-current="page"{% endif %}>Team</a>
              {# Setup stays in the nav until the practice finishes it or puts it away. #}{% if not user.organisation.setup_dismissed_at %}<a href="{{ url_setup }}" class="nav-link" {% if url_setup in request.path %}aria-current="page"{% endif %}>Set up</a>{% endif %}
            {% endif %}
          </div>
        </nav>
      {% endif %}
    </header>

    {% if not user.is_practice_login %}
      {# Moved out of the bottom tab bar so it still shows once that bar is lg:hidden. #}
      <p id="sync-status" hidden role="status"
         class="border-b-2 border-status-week bg-status-week/10 px-4 py-1 text-center text-sm font-medium text-gray-900"></p>
    {% endif %}

    <dialog id="about" data-backdrop-close class="m-auto w-[min(90vw,32rem)] border border-gray-300 p-0 backdrop:bg-gray-900/50">
      <div class="max-h-[85vh] overflow-y-auto p-5">
        <div class="mb-4 flex items-center gap-3">
          <h2 class="flex-1">About StockRoom</h2>
          <button type="button" class="btn btn-line" data-close-dialog>Close</button>
        </div>
        <div class="space-y-5 text-[0.9375rem] leading-relaxed text-gray-800">
          <p>StockRoom is the practice's shared stock list. Instead of a monthly stocktake, it's kept up to date by whoever's actually using the supplies, so the picture of what's on the shelf is always current.</p>
          <div>
            <p class="kicker mb-1.5 text-primary-dark">How it works</p>
            <p>Assistants log an item as soon as they use it, no counting sheets, no forms to fill in. StockRoom watches each item's usage rate and tells you when it's likely to run out, rather than waiting for someone to notice a gap on the shelf. The manager then works from a single reorder list grouped by supplier, calls or emails them in a tap, and ticks items off once they're ordered.</p>
          </div>
          <div>
            <p class="kicker mb-1.5 text-primary-dark">Why it's worth using</p>
            <p>It catches items before they run out instead of after, saves the team from doing mental maths or keeping a whiteboard tally, and gives a rough sense of what the practice spends on supplies without anyone having to dig through invoices.</p>
          </div>
          <div>
            <p class="kicker mb-1.5 text-primary-dark">Signing in</p>
            <p>Each device signs in once with the practice's email and password. After that, whoever picks it up taps their own code (2 digits for assistants, 4 for managers), so StockRoom knows who logged what without anyone stopping to log in properly. To hand over, tap your name at the top and choose Switch person.</p>
          </div>
          <div>
            <p class="kicker mb-1.5 text-primary-dark">Roles</p>
            <p>Dental assistants can log what they've used, flag an item as running low, and ask the manager to put something on the reorder list, and that's about all. No prices, no supplier calls, no admin screens to wade through, so it stays quick to use with gloves on between patients. Practice managers and owners can do everything assistants can, plus order stock, call or email suppliers, add and edit items, update counts and prices, edit suppliers and their delivery times, and see the Spending page.</p>
          </div>
        </div>
      </div>
    </dialog>

    <dialog id="sheet" data-backdrop-close
            class="sheet w-full max-w-md border-t border-gray-300 p-0 backdrop:bg-gray-900/50 sm:border">
      <div id="sheet-content" class="max-h-[85vh] overflow-y-auto px-4 pt-4 pb-[calc(1.25rem+env(safe-area-inset-bottom))]"></div>
    </dialog>
  {% endif %}

  {% block main %}
    <main class="mx-auto max-w-md px-4 pt-5 lg:max-w-3xl lg:px-6 lg:pt-8 {% if user.is_authenticated and not user.is_practice_login %}pb-28 lg:pb-10{% else %}pb-8{% endif %}">
      {% block content %}{% endblock %}
    </main>
  {% endblock %}

  {% if user.is_authenticated and not user.is_practice_login %}
    {# The header grows a nav row of its own once there's room; this stays for narrower screens. #}
    <nav class="fixed inset-x-0 bottom-0 z-30 border-t border-gray-300 bg-app-bg pb-[env(safe-area-inset-bottom)] lg:hidden"
         aria-label="Main">
      <div class="mx-auto flex max-w-md">
        <a href="{{ url_home }}" class="nav-tab" {% if request.path == url_home %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ url_log_usage }}" class="nav-tab" {% if request.path == url_log_usage %}aria-current="page"{% endif %}>Log usage</a>
        <a href="{{ url_reorder_list }}" class="nav-tab" {% if request.path == url_reorder_list %}aria-current="page"{% endif %}>Reorder list</a>
        <a href="{{ url_deliveries }}" class="nav-tab" {% if request.path == url_deliveries %}aria-current="page"{% endif %}>Deliveries</a>
        {% if user.is_org_admin %}
          {# The More pages (and the pages under them) light up More, so you can see where you are. #}
          <div class="relative flex min-w-0 flex-1" x-data="dropdown" @click.outside="close">
            <button type="button" class="nav-tab" @click="toggle" :aria-expanded="open" aria-haspopup="true"
                    {% if url_items in request.path or url_stocktake in request.path or url_suppliers in request.path or url_spending in request.path or url_activity in request.path or url_team in request.path or url_setup in request.path or url_tax in request.path %}data-current{% endif %}>More</button>
            <div x-show="open" x-cloak class="absolute right-0 bottom-full mb-1 w-52 border border-gray-300 bg-app-bg py-1 shadow-lg">
              <a href="{{ url_items }}" class="menu-item" {% if url_items in request.path or url_stocktake in request.path %}aria-current="page"{% endif %}>Stock</a>
              <a href="{{ url_suppliers }}" class="menu-item" {% if url_suppliers in request.path %}aria-current="page"{% endif %}>Suppliers</a>
              <a href="{{ url_spending }}" class="menu-item" {% if url_spending in request.path %}aria-current="page"{% endif %}>Spending</a>
              <a href="{{ url_tax }}" class="menu-item" {% if url_tax in request.path %}aria-current="page"{% endif %}>Stock expenses</a>
              <a href="{{ url_activity }}" class="menu-item" {% if url_activity in request.path %}aria-current="page"{% endif %}>Activity</a>
              <a href="{{ url_team }}" class="menu-item" {% if url_team in request.path %}aria-current="page"{% endif %}>Team</a>
              {# Setup stays in the nav until the practice finishes it or puts it away. #}{% if not user.organisation.setup_dismissed_at %}<a href="{{ url_setup }}" class="menu-item" {% if url_setup in request.path %}aria-current="page"{% endif %}>Set up</a>{% endif %}
            </div>
          </div>
        {% endif %}
      </div>
    </nav>
  {% endif %}

  {# app.js first: it registers the Alpine components on alpine:init. #}
  <script src="{% static 'js/app.js' %}" defer></script>
  <script src="{% static 'vendor/alpine-csp.min.js' %}" defer></script>
</body>
</html>
