{% extends "registration/auth_base.html" %}

{% block title %}Log in · StockRoom{% endblock %}
{% block heading %}Log in{% endblock %}

{% block body %}
<form method="post" class="mt-6 space-y-4">
  {% csrf_token %}
  {{ form }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="btn-primary">Log in</button>
</form>
<div class="mt-6 text-center">
  <a class="link" href="{% url 'password_reset' %}">Forgotten your password?</a>
  {% if signup_enabled %}
    <p>New to StockRoom? <a class="link" href="{% url 'signup' %}">Set up your practice</a></p>
  {% endif %}
</div>
{% endblock %}
