{% extends "registration/auth_base.html" %}

{% block title %}Change your password · StockRoom{% endblock %}
{% block heading %}Change your password{% endblock %}

{% block body %}
<form method="post" class="mt-6 space-y-4">
  {% csrf_token %}
  {{ form }}
  <button type="submit" class="btn-primary">Change password</button>
</form>
<p class="mt-6 text-center"><a class="link" href="{% url 'stock:home' %}">Cancel</a></p>
{% endblock %}
