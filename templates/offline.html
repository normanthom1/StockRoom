{% extends "base.html" %}

{% block title %}Offline · StockRoom{% endblock %}

{% block content %}
  <h1 class="text-2xl font-bold text-primary-dark">No connection</h1>
  {% partialdef message inline %}
    <p class="py-4 text-gray-700">You're offline. Check your Wi-Fi or mobile data, then try again.</p>
  {% endpartialdef %}
  <button type="button" onclick="location.reload()"
          class="tap-target mt-2 w-full rounded-lg bg-primary px-4 text-lg font-semibold text-white">Try again</button>
{% endblock %}
