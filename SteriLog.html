/* Industry: design-system tokens and component classes. This file is the source of truth for the system's look, retune it here and see readme.md. */
:root {
  --color-bg: #f2f2f3;
  --color-surface: #e9e9ea;
  --color-text: #1d1f20;
  --color-accent: #5980a6;
  --color-accent-2: #728fab;
  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

  /* Tonal ramps: generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f5f5f8;
  --color-neutral-200: #e7e7ea;
  --color-neutral-300: #d4d4d7;
  --color-neutral-400: #b7b7ba;
  --color-neutral-500: #98989b;
  --color-neutral-600: #7a7a7d;
  --color-neutral-700: #5d5d60;
  --color-neutral-800: #424244;
  --color-neutral-900: #2b2b2d;

  --color-accent-100: #eef6ff;
  --color-accent-200: #d6ebff;
  --color-accent-300: #b5d9fd;
  --color-accent-400: #94bce3;
  --color-accent-500: #749dc4;
  --color-accent-600: #597ea3;
  --color-accent-700: #416180;
  --color-accent-800: #2c455d;
  --color-accent-900: #1d2d3d;

  --color-accent-2-100: #eef6ff;
  --color-accent-2-200: #d6ebff;
  --color-accent-2-300: #bdd8f2;
  --color-accent-2-400: #9ebbd8;
  --color-accent-2-500: #7e9cb8;
  --color-accent-2-600: #627d98;
  --color-accent-2-700: #486077;
  --color-accent-2-800: #314457;
  --color-accent-2-900: #1f2d3a;

  --font-heading: "Barlow Condensed", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Barlow", system-ui, sans-serif;

  --space-1: 3.4px;
  --space-2: 6.8px;
  --space-3: 10.2px;
  --space-4: 13.6px;
  --space-6: 20.4px;
  --space-8: 27.2px;

  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 7px;

  /* Elevation: derived from the ground, soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.blueprint {
  position: relative;
  border: 1px solid var(--color-divider);
  border-radius: 0;
}
/* The overlay image treatments (halftone, duotone) clip their overlay
   (overflow:hidden); a blueprint wrapper draws its registration marks
   outside the box, so when both classes share a wrapper the frame must
   win. */
.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }
.blueprint > .corner {
  position: absolute; width: 11px; height: 11px;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.blueprint > .corner::before, .blueprint > .corner::after {
  content: ""; position: absolute; background: currentColor;
}
.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
.blueprint > .corner.tl { top: -6px; left: -6px; }
.blueprint > .corner.tr { top: -6px; right: -6px; }
.blueprint > .corner.bl { bottom: -6px; left: -6px; }
.blueprint > .corner.br { bottom: -6px; right: -6px; }

.duotone{position:relative;overflow:hidden}
.duotone::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:var(--color-accent);mix-blend-mode:color}

/* ══════════════════════════════════════════════════════════════════════════
   Components, built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* rules */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px,
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* forms */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* cards */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* tags */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* navigation */

/* --------------------------------------------------------------------------
   Seeded history: roughly four weeks of reprocessing so the records screen
   and the audit pack have something real in them from the first tap.
   -------------------------------------------------------------------------- */
function seed() {
  const cycles = [], checks = [], ncs = [];
  let n = 1;
  // Work off the list of working days rather than raw calendar offsets, so the
  // seeded failures land on days that actually have cycles no matter which day
  // of the week the demo is opened on.
  const days = [];
  for (let back = 28; back >= 0; back--) {
    const d = addDays(TODAY, -back);
    if (!isWeekend(d)) days.push({date:d, back:back});
  }
  const failDayA = days.length - 15; // a fortnight back, closed out properly
  const failDayB = days.length - 2;  // this week, still open

  days.forEach((entry, dayIndex) => {
    const day = entry.date, back = entry.back;
    const dayIso = iso(day);

    CHECKS.forEach((c) => {
      if (c.every === 7 && day.getDay() !== 1) return;
      EQUIPMENT.filter((e) => e.kind === c.equip).forEach((e) => {
        if (back === 0) return; // today's checks are left for the user to do
        checks.push({id:'chk' + checks.length, checkId:c.id, equipId:e.id, date:dayIso,
          result:'pass', by:pick(['Johanna','Liz']), at:day.getTime() + 8 * 3600000});
      });
    });

    const count = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < count; i++) {
      // Today's seeded cycles stop at the current hour so the log never
      // shows a load that has not happened yet.
      if (back === 0 && 8 + i * 2 > new Date().getHours()) break;
      const st = rnd() > 0.45 ? EQUIPMENT[0] : EQUIPMENT[1];
      const prog = rnd() > 0.15 ? PROGRAMMES[0] : PROGRAMMES[1];
      const started = day.getTime() + (8 + i * 2) * 3600000 + Math.floor(rnd() * 40) * 60000;
      const items = [];
      const howMany = 1 + Math.floor(rnd() * 3);
      for (let k = 0; k < howMany; k++) {
        const t = pick(LOAD_TYPES);
        if (!items.some((x) => x.type === t)) items.push({type:t, qty:1 + Math.floor(rnd() * 5)});
      }
      // One deliberate failure three weeks back, closed out properly, and one
      // recent failure still open so the register is not an empty table.
      const failed = (dayIndex === failDayA && i === 1) || (dayIndex === failDayB && i === 2);
      const cyc = {
        id:'C' + String(n).padStart(4, '0'), num:n++, equipId:st.id, prog:prog.id,
        date:dayIso, startedAt:started, startedBy:pick(['Johanna','Liz']),
        temp:prog.temp, pressure:prog.pressure, hold:prog.hold, items:items,
        ciExternal:'pass', ciInternal:failed ? 'fail' : 'pass',
        dryIntact:failed ? false : true, printout:true,
        status:failed ? 'quarantined' : 'released',
        endedAt:started + prog.mins * 60000, by:pick(['Johanna','Liz'])
      };
      cyc.releasedBy = cyc.by; cyc.releasedAt = cyc.endedAt + 240000;
      cycles.push(cyc);
      if (failed) {
        const closed = dayIndex === failDayA;
        ncs.push({
          id:'NC' + String(ncs.length + 1).padStart(3, '0'), cycleId:cyc.id, date:dayIso,
          raisedBy:cyc.by, raisedAt:cyc.releasedAt,
          issue:'Internal chemical indicator did not reach the reference colour. Load damp on removal.',
          immediate:'Load quarantined, not released for clinical use. Instruments returned for full reprocessing.',
          status:closed ? 'closed' : 'open',
          corrective:closed ? 'Chamber drain filter cleaned and drying phase extended by 3 minutes. Three consecutive test loads passed. Melag technician attended and confirmed no fault. Reprocessing staff rebriefed on load spacing.' : '',
          closedBy:closed ? 'Sandy' : '', closedAt:closed ? parseIso(dayIso).getTime() + 4 * 86400000 : null
        });
        cyc.ncId = ncs[ncs.length - 1].id;
      }
    }
  });
  return {cycles, checks, ncs};
}

const seeded = seed();

const state = {
  pin:'', pinOpen:true, pinErr:'', who:null,
  screen:'today', toast:null, undo:null,
  cycles:seeded.cycles, checks:seeded.checks, ncs:seeded.ncs,
  equipment:EQUIPMENT.map((e) => Object.assign({}, e)),
  training:TRAINING.map((t) => Object.assign({}, t)),
  // in-flight cycle being logged
  draft:null, detail:null, ncDetail:null, backTo:'today',
  rangeDays:28, filterEquip:'all'
};

/* --------------------------------------------------------------------------
   Derived facts. These drive both the home screen prompts and the compliance
   summary at the top of the audit pack.
   -------------------------------------------------------------------------- */
function equipOf(id) { return state.equipment.find((e) => e.id === id) || state.equipment[0]; }
function progOf(id) { return PROGRAMMES.find((p) => p.id === id) || PROGRAMMES[0]; }
function validationDue(e) { return iso(addDays(parseIso(e.validated), e.validEvery * 30.44)); }
function validationDaysLeft(e) { return daysBetween(iso(TODAY), validationDue(e)); }
function trainingDue(t) { return iso(addDays(parseIso(t.done), 365)); }
function trainingDaysLeft(t) { return daysBetween(iso(TODAY), trainingDue(t)); }

function checkDone(checkId, equipId, dayIso) {
  return state.checks.find((c) => c.checkId === checkId && c.equipId === equipId && c.date === dayIso);
}
// Outstanding checks for today. Weekly checks only fall due once their
// interval has elapsed, so a Tuesday does not nag about a Monday foil test.
function outstandingChecks() {
  const out = [];
  const todayIso = iso(TODAY);
  CHECKS.forEach((c) => {
    state.equipment.filter((e) => e.kind === c.equip).forEach((e) => {
      if (checkDone(c.id, e.id, todayIso)) return;
      if (c.every > 1) {
        const last = state.checks.filter((x) => x.checkId === c.id && x.equipId === e.id)
          .sort((a, b) => b.date.localeCompare(a.date))[0];
        if (last && daysBetween(last.date, todayIso) < c.every) return;
      }
      out.push({check:c, equip:e});
    });
  });
  return out;
}

function openNcs() { return state.ncs.filter((n) => n.status === 'open'); }
function runningCycles() { return state.cycles.filter((c) => c.status === 'running'); }
function todayCycles() { return state.cycles.filter((c) => c.date === iso(TODAY)).sort((a, b) => b.startedAt - a.startedAt); }

// The readiness list is the whole point of the product: the things an auditor
// would find, surfaced before the auditor does.
function gaps() {
  const g = [];
  state.equipment.forEach((e) => {
    const left = validationDaysLeft(e);
    if (left < 0) g.push({level:'fail', text:e.name + ' validation expired ' + Math.abs(left) + ' days ago', where:'equipment'});
    else if (left <= 60) g.push({level:'warn', text:e.name + ' validation due in ' + left + ' days', where:'equipment'});
  });
  const oc = outstandingChecks();
  if (oc.length) g.push({level:'warn', text:oc.length + ' reprocessing ' + (oc.length === 1 ? 'check' : 'checks') + ' not logged today', where:'checks'});
  const on = openNcs();
  if (on.length) g.push({level:'fail', text:on.length + ' open non-conformance ' + (on.length === 1 ? 'record' : 'records'), where:'ncs'});
  state.training.forEach((t) => {
    const left = trainingDaysLeft(t);
    if (left < 0) g.push({level:'fail', text:t.name + ' IPC training expired ' + Math.abs(left) + ' days ago', where:'training'});
    else if (left <= 45) g.push({level:'warn', text:t.name + ' IPC training due in ' + left + ' days', where:'training'});
  });
  return g;
}

/* --------------------------------------------------------------------------
   Rendering. Plain string templates and one root re-render, which is plenty
   for a prototype and keeps the whole app readable in one sitting.
   -------------------------------------------------------------------------- */
const app = document.getElementById('app');
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function me() { return state.who ? STAFF[state.who] : null; }
function isManager() { return !!(me() && me().manager); }

function flash(msg, undo) {
  state.toast = msg; state.undo = undo || null;
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { state.toast = null; state.undo = null; render(); }, 6000);
  render();
}
function deny(msg) { flash(msg); }

function statusChip(status) {
  if (status === 'released') return '<span class="chip chip-pass">Released</span>';
  if (status === 'quarantined') return '<span class="chip chip-fail">Quarantined</span>';
  return '<span class="chip chip-run">Running</span>';
}

function loadSummary(items) {
  if (!items || !items.length) return 'No load (test cycle)';
  return items.map((i) => i.qty + ' × ' + i.type.replace(/s$/, i.qty === 1 ? '' : 's')).join(', ');
}

/* ---- screens ---- */

function viewToday() {
  const g = gaps();
  const oc = outstandingChecks();
  const run = runningCycles();
  const tc = todayCycles();
  const worst = g.some((x) => x.level === 'fail') ? 'fail' : (g.length ? 'warn' : 'pass');

  return `
  <div class="scroll">
    <div class="pad">
      <div class="row-head">
        <h2>Today</h2>
        <span class="muted">${esc(fmtShort(TODAY))}</span>
      </div>

      <div class="blueprint readiness ${worst}">${corners()}
        <div class="card-kicker">Audit readiness</div>
        ${g.length === 0
          ? '<div class="big-ok">Nothing outstanding. Records are complete and current.</div>'
          : g.map((x) => `<button class="gap-line" data-go="${esc(x.where)}"><span class="dot ${x.level}"></span><span>${esc(x.text)}</span><span class="chev">›</span></button>`).join('')}
      </div>

      ${run.length ? `
      <div class="section">
        <div class="card-kicker">In the chamber</div>
        ${run.map((c) => {
          const e = equipOf(c.equipId), p = progOf(c.prog);
          const left = Math.max(0, Math.round((c.startedAt + p.mins * 60000 - Date.now()) / 60000));
          return `<button class="cycle-row running" data-cycle="${c.id}">
            <span class="stripe" style="background:${C.warn}"></span>
            <span class="cycle-main">
              <span class="cycle-name">${esc(c.id)} · ${esc(e.name)}</span>
              <span class="cycle-sub">${esc(p.label)} · started ${esc(fmtTime(c.startedAt))} · ${esc(loadSummary(c.items))}</span>
            </span>
            <span class="cycle-right">${left > 0 ? '~' + left + ' min' : 'Ready'}</span>
          </button>`;
        }).join('')}
      </div>` : ''}

      <div class="section">
        <div class="card-kicker">Checks before the first load</div>
        ${CHECKS.map((c) => {
          const rows = state.equipment.filter((e) => e.kind === c.equip).map((e) => {
            const done = checkDone(c.id, e.id, iso(TODAY));
            const due = oc.some((o) => o.check.id === c.id && o.equip.id === e.id);
            if (!done && !due) return '';
            return `<button class="check-row" data-check="${c.id}" data-equip="${e.id}" ${done ? 'disabled' : ''}>
              <span class="tick ${done ? 'done' : ''}">${done ? '✓' : ''}</span>
              <span class="check-main">
                <span class="check-name">${esc(c.label)}</span>
                <span class="check-sub">${esc(e.name)}${done ? ' · logged ' + esc(fmtTime(done.at)) + ' by ' + esc(done.by) : ' · ' + esc(c.note)}</span>
              </span>
            </button>`;
          }).join('');
          return rows;
        }).join('')}
      </div>

      <div class="section">
        <div class="card-kicker">Cycles logged today (${tc.length})</div>
        ${tc.length === 0 ? '<div class="empty">No cycles logged yet today.</div>' :
          tc.map((c) => {
            const e = equipOf(c.equipId), p = progOf(c.prog);
            const col = c.status === 'quarantined' ? C.fail : (c.status === 'running' ? C.warn : C.pass);
            return `<button class="cycle-row" data-cycle="${c.id}">
              <span class="stripe" style="background:${col}"></span>
              <span class="cycle-main">
                <span class="cycle-name">${esc(c.id)} · ${esc(e.name)}</span>
                <span class="cycle-sub">${esc(fmtTime(c.startedAt))} · ${esc(p.label)} · ${esc(loadSummary(c.items))}</span>
              </span>
              <span class="cycle-right">${statusChip(c.status)}</span>
            </button>`;
          }).join('')}
      </div>
    </div>
  </div>
  <div class="footer">
    <button class="btn btn-primary big" data-act="newCycle">Log a cycle</button>
  </div>`;
}

function viewLogCycle() {
  const d = state.draft;
  const e = d.equipId ? equipOf(d.equipId) : null;
  const expired = e && validationDaysLeft(e) < 0;

  if (d.stage === 'start') {
    return `
    <div class="scroll"><div class="pad">
      <div class="row-head"><button class="btn btn-ghost back" data-act="home">← Back</button><h2>Log a cycle</h2></div>

      <div class="field-lg">
        <div class="card-kicker">1. Which steriliser</div>
        ${state.equipment.filter((x) => x.kind === 'steriliser').map((x) => {
          const bad = validationDaysLeft(x) < 0;
          return `<button class="pick ${d.equipId === x.id ? 'on' : ''}" data-set="equipId" data-val="${x.id}">
            <span class="pick-main"><span class="pick-name">${esc(x.name)}</span>
            <span class="pick-sub">Class ${esc(x.cls)} · ${esc(x.location)} · ${bad ? 'validation expired' : 'validated to ' + esc(fmtDate(validationDue(x)))}</span></span>
            ${bad ? '<span class="chip chip-fail">Expired</span>' : ''}
          </button>`;
        }).join('')}
      </div>

      ${expired ? `<div class="warnbox">${esc(e.name)} is outside its validation date. A load released from it cannot be evidenced as sterile. Log the cycle if you need the record, but the load will be held until Sandy records a current validation.</div>` : ''}

      <div class="field-lg">
        <div class="card-kicker">2. Programme</div>
        ${PROGRAMMES.map((p) => `<button class="pick ${d.prog === p.id ? 'on' : ''}" data-set="prog" data-val="${p.id}">
          <span class="pick-main"><span class="pick-name">${esc(p.label)}</span>
          <span class="pick-sub">${esc(p.note)} · ${p.temp}°C · ${p.hold} min hold · about ${p.mins} min</span></span>
        </button>`).join('')}
      </div>

      <div class="field-lg">
        <div class="card-kicker">3. What is in the load</div>
        ${d.prog === 'helix'
          ? '<div class="empty">A helix test runs empty. Nothing to add.</div>'
          : `<div class="chips">
              ${LOAD_TYPES.map((t) => {
                const it = d.items.find((x) => x.type === t);
                return `<button class="loadchip ${it ? 'on' : ''}" data-load="${esc(t)}">${esc(t)}${it ? ' <b>× ' + it.qty + '</b>' : ''}</button>`;
              }).join('')}
            </div>
            <div class="hint">Tap to add one, tap again to add another. Long list, but it is the same six every day so they sit at the top of muscle memory.</div>`}
      </div>

      <div class="field-lg">
        <div class="card-kicker">4. Load note (optional)</div>
        <input id="loadNote" class="input tall" placeholder="e.g. Dr Patel's surgical kit for Thursday" value="${esc(d.note || '')}">
      </div>
    </div></div>
    <div class="footer">
      <button class="btn btn-primary big" data-act="startCycle">Start cycle</button>
    </div>`;
  }

  // stage: release
  const p = progOf(d.prog);
  return `
  <div class="scroll"><div class="pad">
    <div class="row-head"><button class="btn btn-ghost back" data-act="home">← Back</button><h2>Release ${esc(d.id)}</h2></div>
    <div class="blueprint summary">${corners()}
      <div><b>${esc(equipOf(d.equipId).name)}</b></div>
      <div class="muted">${esc(p.label)} · started ${esc(fmtTime(d.startedAt))} by ${esc(d.startedBy)}</div>
      <div class="muted">${esc(loadSummary(d.items))}${d.note ? ' · ' + esc(d.note) : ''}</div>
    </div>

    <div class="field-lg">
      <div class="card-kicker">1. Confirm against the printout</div>
      <div class="paramgrid">
        <label>Temperature reached<span><input id="pTemp" class="input" type="number" step="0.1" value="${p.temp}"> °C</span></label>
        <label>Pressure<span><input id="pPress" class="input" type="number" step="0.1" value="${p.pressure}"> bar</span></label>
        <label>Hold time<span><input id="pHold" class="input" type="number" step="0.5" value="${p.hold}"> min</span></label>
      </div>
      <label class="checkline"><input type="checkbox" id="pPrintout" ${d.printout !== false ? 'checked' : ''}> Printout or data log filed against this cycle</label>
    </div>

    <div class="field-lg">
      <div class="card-kicker">2. Indicators</div>
      <div class="twoup">
        <div><div class="lbl">External (Class 1)</div>
          <div class="seg2">
            <button class="segbtn ${d.ciExternal === 'pass' ? 'on pass' : ''}" data-set="ciExternal" data-val="pass">Pass</button>
            <button class="segbtn ${d.ciExternal === 'fail' ? 'on fail' : ''}" data-set="ciExternal" data-val="fail">Fail</button>
          </div></div>
        <div><div class="lbl">Internal (Class 4 to 6)</div>
          <div class="seg2">
            <button class="segbtn ${d.ciInternal === 'pass' ? 'on pass' : ''}" data-set="ciInternal" data-val="pass">Pass</button>
            <button class="segbtn ${d.ciInternal === 'fail' ? 'on fail' : ''}" data-set="ciInternal" data-val="fail">Fail</button>
          </div></div>
      </div>
      <label class="checkline"><input type="checkbox" id="pDry" ${d.dryIntact !== false ? 'checked' : ''}> Load dry, packs intact and seals sound</label>
    </div>
  </div></div>
  <div class="footer footer-2">
    <button class="btn btn-secondary big" data-act="quarantine">Quarantine load</button>
    <button class="btn btn-primary big" data-act="release">Release load</button>
  </div>`;
}

function viewCycle() {
  const c = state.cycles.find((x) => x.id === state.detail);
  if (!c) return viewToday();
  const e = equipOf(c.equipId), p = progOf(c.prog);
  const nc = c.ncId ? state.ncs.find((n) => n.id === c.ncId) : null;
  return `
  <div class="scroll"><div class="pad">
    <div class="row-head"><button class="btn btn-ghost back" data-act="back">← Back</button><h2>${esc(c.id)}</h2>${statusChip(c.status)}</div>

    <div class="blueprint rec">${corners()}
      <div class="card-kicker">Sterilisation cycle record</div>
      ${recRow('Load / batch ID', c.id)}
      ${recRow('Steriliser', e.name + ' (' + e.serial + ')')}
      ${recRow('Programme', p.label)}
      ${recRow('Date', fmtDate(c.date))}
      ${recRow('Started', fmtTime(c.startedAt) + ' by ' + c.startedBy)}
      ${c.status !== 'running' ? recRow('Cycle ended', fmtTime(c.endedAt)) : ''}
      ${recRow('Load contents', loadSummary(c.items))}
      ${c.note ? recRow('Load note', c.note) : ''}
      ${recRow('Temperature', c.temp + ' °C')}
      ${recRow('Pressure', c.pressure + ' bar')}
      ${recRow('Hold time', c.hold + ' min')}
      ${recRow('Printout filed', c.printout ? 'Yes' : 'No')}
      ${recRow('External indicator', c.ciExternal === 'pass' ? 'Pass' : 'Fail', c.ciExternal)}
      ${recRow('Internal indicator', c.ciInternal === 'pass' ? 'Pass' : 'Fail', c.ciInternal)}
      ${recRow('Load dry and intact', c.dryIntact ? 'Yes' : 'No', c.dryIntact ? 'pass' : 'fail')}
      ${c.status === 'released' ? recRow('Released for use', fmtTime(c.releasedAt) + ' by ' + c.releasedBy, 'pass') : ''}
      ${c.status === 'quarantined' ? recRow('Quarantined', fmtTime(c.releasedAt) + ' by ' + c.releasedBy, 'fail') : ''}
    </div>

    ${nc ? `<button class="blueprint ncbox" data-nc="${nc.id}">${corners()}
      <div class="card-kicker">Linked non-conformance</div>
      <div class="ncline"><b>${esc(nc.id)}</b> ${nc.status === 'open' ? '<span class="chip chip-fail">Open</span>' : '<span class="chip chip-pass">Closed</span>'}</div>
      <div class="muted">${esc(nc.issue)}</div>
    </button>` : ''}

    <div class="tracenote">This record is the traceability link for every instrument in the load. Write <b>${esc(c.id)}</b> in the patient notes for any procedure using instruments from this batch, and the two records tie together at audit.</div>
  </div></div>`;
}

function recRow(k, v, tone) {
  return `<div class="recrow"><span>${esc(k)}</span><span class="${tone ? 'tone-' + tone : ''}">${esc(v)}</span></div>`;
}
function corners() { return '<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>'; }

function viewRecords() {
  const from = iso(addDays(TODAY, -state.rangeDays));
  const rows = state.cycles.filter((c) => c.date >= from && (state.filterEquip === 'all' || c.equipId === state.filterEquip))
    .sort((a, b) => b.startedAt - a.startedAt);
  const fails = rows.filter((r) => r.status === 'quarantined').length;
  return `
  <div class="scroll"><div class="pad">
    <div class="row-head"><h2>Records</h2></div>

    <div class="filters">
      <div class="seg2 wide">
        ${[7, 28, 90].map((d) => `<button class="segbtn ${state.rangeDays === d ? 'on' : ''}" data-range="${d}">${d} days</button>`).join('')}
      </div>
      <select id="fEquip" class="input">
        <option value="all">All sterilisers</option>
        ${state.equipment.filter((e) => e.kind === 'steriliser').map((e) => `<option value="${e.id}" ${state.filterEquip === e.id ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}
      </select>
    </div>

    <div class="statstrip">
      <div><b>${rows.length}</b><span>cycles</span></div>
      <div><b>${rows.length - fails}</b><span>released</span></div>
      <div class="${fails ? 'bad' : ''}"><b>${fails}</b><span>quarantined</span></div>
    </div>

    <div class="section">
      <div class="card-kicker">Cycle log</div>
      ${rows.length === 0 ? '<div class="empty">No cycles in this range.</div>' : rows.map((c) => {
        const e = equipOf(c.equipId);
        const col = c.status === 'quarantined' ? C.fail : (c.status === 'running' ? C.warn : C.pass);
        return `<button class="cycle-row" data-cycle="${c.id}">
          <span class="stripe" style="background:${col}"></span>
          <span class="cycle-main">
            <span class="cycle-name">${esc(c.id)} · ${esc(fmtShort(c.date))} ${esc(fmtTime(c.startedAt))}</span>
            <span class="cycle-sub">${esc(e.name)} · ${esc(loadSummary(c.items))}</span>
          </span>
          <span class="cycle-right">${statusChip(c.status)}</span>
        </button>`;
      }).join('')}
    </div>

    <div class="section">
      <div class="card-kicker">Non-conformance register</div>
      ${state.ncs.length === 0 ? '<div class="empty">No non-conformances recorded.</div>' :
        state.ncs.slice().reverse().map((n) => `<button class="cycle-row" data-nc="${n.id}">
          <span class="stripe" style="background:${n.status === 'open' ? C.fail : C.pass}"></span>
          <span class="cycle-main">
            <span class="cycle-name">${esc(n.id)} · ${esc(fmtShort(n.date))}</span>
            <span class="cycle-sub">${esc(n.issue)}</span>
          </span>
          <span class="cycle-right">${n.status === 'open' ? '<span class="chip chip-fail">Open</span>' : '<span class="chip chip-pass">Closed</span>'}</span>
        </button>`).join('')}
    </div>
  </div></div>
  <div class="footer">
    <button class="btn btn-primary big" data-act="auditPack">Build the audit record</button>
  </div>`;

/* ---- actions ---- */

function startDraft() {
  const last = state.cycles.filter((c) => c.status !== 'running').slice(-1)[0];
  state.draft = {
    stage:'start', equipId:(last && last.equipId) || 'st1', prog:'b134', items:[], note:'',
    ciExternal:'pass', ciInternal:'pass', dryIntact:true, printout:true
  };
  state.screen = 'log';
}

function nextId() {
  const nums = state.cycles.map((c) => c.num || 0);
  const n = Math.max(0, ...nums) + 1;
  return {id:'C' + String(n).padStart(4, '0'), num:n};
}

function commitStart() {
  const d = state.draft;
  const noteEl = document.getElementById('loadNote');
  if (noteEl) d.note = noteEl.value.trim();
  if (d.prog !== 'helix' && d.items.length === 0) return flash('Add what is in the load first');
  const p = progOf(d.prog);
  const idn = nextId();
  const cyc = Object.assign({}, d, idn, {
    date:iso(TODAY), startedAt:Date.now(), startedBy:me().name,
    temp:p.temp, pressure:p.pressure, hold:p.hold,
    status:'running', endedAt:Date.now() + p.mins * 60000
  });
  delete cyc.stage;
  state.cycles.push(cyc);
  state.draft = null; state.screen = 'today';
  flash(cyc.id + ' started on ' + equipOf(cyc.equipId).name);
}

function openRelease(id) {
  const c = state.cycles.find((x) => x.id === id);
  if (!c) return;
  if (c.status !== 'running') { state.detail = id; state.screen = 'cycle'; return; }
  state.draft = Object.assign({}, c, {stage:'release'});
  state.screen = 'log';
}

function finishCycle(outcome) {
  const d = state.draft;
  const c = state.cycles.find((x) => x.id === d.id);
  if (!c) return;
  const num = (sel, fallback) => { const el = document.getElementById(sel); const v = el ? parseFloat(el.value) : NaN; return isNaN(v) ? fallback : v; };
  c.temp = num('pTemp', c.temp);
  c.pressure = num('pPress', c.pressure);
  c.hold = num('pHold', c.hold);
  const pr = document.getElementById('pPrintout'); c.printout = pr ? pr.checked : true;
  const dry = document.getElementById('pDry'); c.dryIntact = dry ? dry.checked : true;
  c.ciExternal = d.ciExternal; c.ciInternal = d.ciInternal;
  c.endedAt = Date.now(); c.releasedAt = Date.now(); c.releasedBy = me().name;

  // A load off a steriliser that is out of validation cannot be evidenced as
  // sterile, so it is held whatever the indicators say.
  const outOfValidation = validationDaysLeft(equipOf(c.equipId)) < 0;
  const problem = outcome === 'quarantine' || outOfValidation ||
    c.ciExternal === 'fail' || c.ciInternal === 'fail' || !c.dryIntact || !c.printout;
  if (problem) {
    c.status = 'quarantined';
    const reasons = [];
    if (c.ciExternal === 'fail') reasons.push('external chemical indicator failed');
    if (c.ciInternal === 'fail') reasons.push('internal chemical indicator failed');
    if (!c.dryIntact) reasons.push('load damp or packaging not intact');
    if (!c.printout) reasons.push('no printout or data log filed');
    if (outOfValidation) reasons.push(equipOf(c.equipId).name + ' is outside its validation date');
    if (!reasons.length) reasons.push('held by the operator');
    const ncNum = Math.max(0, ...state.ncs.map((x) => parseInt(x.id.slice(2), 10) || 0)) + 1;
    const nc = {
      id:'NC' + String(ncNum).padStart(3, '0'), cycleId:c.id, date:c.date,
      raisedBy:me().name, raisedAt:Date.now(),
      issue:'Cycle ' + c.id + ': ' + reasons.join(', ') + '.',
      immediate:'Load quarantined, not released for clinical use. Instruments returned for full reprocessing.',
      status:'open', corrective:'', closedBy:'', closedAt:null
    };
    state.ncs.push(nc); c.ncId = nc.id;
    state.draft = null; state.detail = c.id; state.screen = 'cycle';
    flash(c.id + ' quarantined · ' + nc.id + ' raised for Sandy');
  } else {
    c.status = 'released';
    state.draft = null; state.detail = c.id; state.screen = 'cycle';
    flash(c.id + ' released · batch ID goes in the patient notes');
  }
}

function logCheck(checkId, equipId) {
  if (checkDone(checkId, equipId, iso(TODAY))) return;
  state.checks.push({id:'chk' + state.checks.length, checkId, equipId, date:iso(TODAY),
    result:'pass', by:me().name, at:Date.now()});
  const def = CHECKS.find((c) => c.id === checkId);
  flash(def.label + ' logged on ' + equipOf(equipId).name);
}

function downloadCsv() {
  const from = iso(addDays(TODAY, -state.rangeDays));
  const rows = state.cycles.filter((c) => c.date >= from).sort((a, b) => a.startedAt - b.startedAt);
  const head = ['Batch ID', 'Date', 'Time', 'Steriliser', 'Serial', 'Programme', 'Load', 'Temp C', 'Pressure bar', 'Hold min',
    'External CI', 'Internal CI', 'Dry and intact', 'Printout filed', 'Outcome', 'Logged by', 'Non-conformance'];
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(',')];
  rows.forEach((c) => {
    const e = equipOf(c.equipId), p = progOf(c.prog);
    lines.push([c.id, fmtDate(c.date), fmtTime(c.startedAt), e.name, e.serial, p.label, loadSummary(c.items),
      c.temp, c.pressure, c.hold, c.ciExternal, c.ciInternal, c.dryIntact ? 'Yes' : 'No', c.printout ? 'Yes' : 'No',
      c.status, c.releasedBy || c.startedBy, c.ncId || ''].map(q).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sterilisation-cycle-log-' + iso(TODAY) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  flash('Cycle log downloaded');
}

/* ---- one delegated click handler ---- */

app.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act],[data-key],[data-set],[data-load],[data-cycle],[data-check],[data-nc],[data-range],[data-validate],[data-train],[data-go]');
  if (!t) return;

  if (t.dataset.key != null) {
    const k = t.dataset.key;
    if (k === 'clear') state.pin = '';
    else if (k === 'back') state.pin = state.pin.slice(0, -1);
    else if (state.pin.length < 2) state.pin += k;
    state.pinErr = '';
    if (state.pin.length === 2) {
      const found = STAFF[state.pin];
      if (found) {
        state.who = state.pin; state.pin = ''; state.pinOpen = false;
        render(); flash(found.name + ' signed in · ' + found.role);
        return;
      }
      state.pinErr = 'No one here uses that PIN'; state.pin = '';
    }
    return render();
  }

  if (!state.who) return;

  if (t.dataset.set) { state.draft[t.dataset.set] = t.dataset.val; return render(); }

  if (t.dataset.load) {
    const type = t.dataset.load;
    const it = state.draft.items.find((x) => x.type === type);
    if (it) { it.qty += 1; if (it.qty > 9) state.draft.items = state.draft.items.filter((x) => x.type !== type); }
    else state.draft.items.push({type, qty:1});
    const noteEl = document.getElementById('loadNote');
    if (noteEl) state.draft.note = noteEl.value;
    return render();
  }

  if (t.dataset.cycle) {
    const c = state.cycles.find((x) => x.id === t.dataset.cycle);
    if (state.screen === 'today' || state.screen === 'records') state.backTo = state.screen;
    if (c && c.status === 'running') openRelease(c.id);
    else { state.detail = t.dataset.cycle; state.screen = 'cycle'; }
    return render();
  }

  if (t.dataset.check) { logCheck(t.dataset.check, t.dataset.equip); return; }
  if (t.dataset.nc) {
    if (state.screen === 'today' || state.screen === 'records') state.backTo = state.screen;
    state.ncDetail = t.dataset.nc; state.screen = 'nc'; return render();
  }
  if (t.dataset.range) { state.rangeDays = +t.dataset.range; return render(); }

  if (t.dataset.go) {
    const map = {equipment:'equipment', checks:'today', ncs:'records', training:'equipment'};
    state.screen = map[t.dataset.go] || 'today';
    return render();
  }

  if (t.dataset.validate) {
    if (!isManager()) return deny('Only Sandy records validation dates');
    const el = document.getElementById('val-' + t.dataset.validate);
    const e = state.equipment.find((x) => x.id === t.dataset.validate);
    if (el && el.value) { e.validated = el.value; e.serviced = el.value; flash(e.name + ' validation recorded'); }
    return;
  }

  if (t.dataset.train) {
    if (!isManager()) return deny('Only Sandy updates the training register');
    const rec = state.training.find((x) => x.name === t.dataset.train);
    rec.done = iso(TODAY);
    flash(rec.name + ' IPC training logged for today');
    return;
  }

  const act = t.dataset.act;
  if (act === 'pin') { state.pinOpen = true; state.pin = ''; state.pinErr = ''; return render(); }
  if (act === 'closePin') { state.pinOpen = false; return render(); }
  if (act === 'about') { state.screen = 'about'; return render(); }
  if (act === 'home' || act === 'today') { state.draft = null; state.screen = 'today'; return render(); }
  if (act === 'records') { state.screen = 'records'; return render(); }
  if (act === 'equipment') { state.screen = 'equipment'; return render(); }
  if (act === 'back') { state.screen = state.backTo || 'today'; return render(); }
  if (act === 'newCycle') { startDraft(); return render(); }
  if (act === 'startCycle') return commitStart();
  if (act === 'release') return finishCycle('release');
  if (act === 'quarantine') return finishCycle('quarantine');
  if (act === 'auditPack') { state.screen = 'audit'; return render(); }
  if (act === 'print') { window.print(); return; }
  if (act === 'csv') return downloadCsv();
  if (act === 'closeNc') {
    if (!isManager()) return deny('Only Sandy closes a non-conformance');
    const el = document.getElementById('ncFix');
    const text = el ? el.value.trim() : '';
    if (text.length < 10) return flash('Write what was done about it first');
    const n = state.ncs.find((x) => x.id === state.ncDetail);
    n.corrective = text; n.status = 'closed'; n.closedBy = me().name; n.closedAt = Date.now();
    flash(n.id + ' closed');
    return;
  }
  if (act === 'undo') { state.toast = null; state.undo = null; return render(); }
});

app.addEventListener('change', (ev) => {
  if (ev.target.id === 'fEquip') { state.filterEquip = ev.target.value; render(); }
});

render();

</script>
</body>
</html>
