[tool.ruff]
target-version = "py312"
# Auto-generated by Django; not worth hand-tuning to satisfy the linter.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# RUF012 wants ClassVar on mutable class attributes, which flags idiomatic
# Django everywhere (Meta.constraints, REQUIRED_FIELDS, admin options).
ignore = ["RUF012"]
