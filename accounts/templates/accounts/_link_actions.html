{% comment %}
Shared by invite_ready.html and reset_link_ready.html. Needs `link` (the
plain URL) and `mailto` (a ready-built mailto: href, see accounts.mailto)
in context.
{% endcomment %}
<div x-data="{ copied: false }" class="space-y-3">
  <input type="text" readonly value="{{ link }}" onclick="this.select()"
         class="w-full bg-gray-50 text-sm" aria-label="The link">

  <button type="button" class="btn-primary"
          @click="navigator.clipboard.writeText('{{ link|escapejs }}'); copied = true; setTimeout(() => copied = false, 2000)">
    <span x-show="!copied">Copy link</span>
    <span x-show="copied" x-cloak>Copied</span>
  </button>

  <a class="tap-target flex w-full items-center justify-center rounded-lg border border-primary px-4 font-medium text-primary-dark"
     href="{{ mailto }}">
    Email this link
  </a>
</div>
