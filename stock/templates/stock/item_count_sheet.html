<div class="flex items-baseline gap-3">
  <h2 class="flex-1 text-xl font-bold text-primary-dark">Count {{ item.name }}</h2>
  <button type="button" class="tap-target rounded-lg border border-gray-300 px-3 text-sm font-medium"
          data-close-dialog>Cancel</button>
</div>

{% if error %}<p class="mt-2 text-sm font-medium text-status-now">{{ error }}</p>{% endif %}

<form class="mt-3 flex flex-col gap-3" data-htmx-only>
  <div>
    <label for="qty" class="text-sm font-medium text-gray-900">On the shelf now ({{ item.unit }}s)</label>
    <input id="qty" type="number" inputmode="numeric" min="0" name="qty"
           value="{{ current_qty|default_if_none:'' }}" placeholder="0" autofocus>
  </div>
  <div>
    <label for="order_size" class="text-sm font-medium text-gray-900">Standard order size ({{ item.unit }}s), optional</label>
    <input id="order_size" type="number" inputmode="numeric" min="1" name="order_size"
           value="{{ item.order_size|default_if_none:'' }}" placeholder="{{ order_size_placeholder }}">
  </div>
  <button type="button" hx-post="{% url 'stock:item_count_save' item.pk %}" hx-include="closest form"
          hx-target="#sheet-content" hx-swap="innerHTML" hx-disabled-elt="this"
          class="btn-primary">Save count</button>
</form>
