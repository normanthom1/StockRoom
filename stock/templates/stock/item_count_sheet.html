{% load stock_units %}
<div class="flex items-center gap-3">
  <h2 class="flex-1">Count {{ item.name }}</h2>
  <button type="button" class="btn btn-line" data-close-dialog>Cancel</button>
</div>

{% if error %}<p class="mt-3 text-sm font-medium text-status-now">{{ error }}</p>{% endif %}

<form class="mt-4 flex flex-col gap-4" data-htmx-only>
  <div>
    <label for="qty">On the shelf now ({{ item.unit|plural }})</label>
    <input id="qty" type="number" inputmode="numeric" min="0" name="qty"
           value="{{ current_qty|default_if_none:'' }}" placeholder="0" autofocus class="min-h-16 text-[1.75rem]">
  </div>
  {% if user.is_org_admin %}
    <div>
      <label for="order_size">Standard order size ({{ item.unit|plural }}), optional</label>
      <input id="order_size" type="number" inputmode="numeric" min="1" name="order_size"
             value="{{ item.order_size|default_if_none:'' }}" placeholder="{{ order_size_placeholder }}">
    </div>
  {% endif %}
  <button type="button" hx-post="{% url 'stock:item_count_save' item.pk %}" hx-include="closest form"
          hx-target="#sheet-content" hx-swap="innerHTML" hx-disabled-elt="this"
          class="btn-primary">Save count</button>
</form>
