{% extends "base.html" %}

{% block title %}Log usage · StockRoom{% endblock %}

{% block content %}
<h1 class="mb-3 text-2xl font-bold text-primary-dark">Tap what you used</h1>

<input type="search" name="q" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="none"
       value="{{ query }}" placeholder="Search all {{ total_count }} items…"
       class="mb-3"
       hx-get="{% url 'stock:log_usage' %}" hx-trigger="input changed delay:200ms" hx-target="#tile-grid" hx-swap="innerHTML">

<div id="tile-grid">
  {% partialdef tiles inline %}
  {% if tiles %}
    <div class="grid grid-cols-2 gap-2">
      {% for tile in tiles %}
        <button type="button"
                hx-get="{% url 'stock:log_usage_sheet' tile.id %}" hx-target="#sheet-content" hx-swap="innerHTML"
                class="tap-target flex h-28 flex-col items-start justify-between gap-1 rounded-lg bg-gray-100 p-3 text-left
                  border-l-4 {% if tile.status_color == 'out' %}border-status-out
                  {% elif tile.status_color == 'now' %}border-status-now
                  {% elif tile.status_color == 'week' %}border-status-week
                  {% else %}border-status-ok{% endif %}">
          <span class="font-semibold leading-tight text-gray-900">{{ tile.name }}</span>
          <span class="text-xs text-gray-600">{{ tile.qty }}</span>
        </button>
      {% endfor %}
    </div>
  {% else %}
    <p class="py-10 text-center text-sm text-gray-600">No items match "{{ query }}".</p>
  {% endif %}
  {% endpartialdef %}
</div>
{% endblock %}
