{% extends "base.html" %}

{% block title %}Log usage · StockRoom{% endblock %}

{% block content %}
<h1 class="mb-4">Tap what you used</h1>

{% if tiles %}
  <input type="search" id="tile-search" aria-label="Search items" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="none"
         placeholder="Search all {{ tiles|length }} items…" class="mb-4 min-h-14 text-lg" data-search-input>

  <div id="tile-grid" class="grid grid-cols-2 gap-2.5 lg:grid-cols-3">
    {% for tile in tiles %}
      <button type="button" data-capture-tile
              data-search="{{ tile.name|lower }}" data-name="{{ tile.name }}" data-unit="{{ tile.unit }}"
              data-qty="{{ tile.qty }}" data-after="{{ tile.after }}" data-has-qty="{{ tile.has_qty|yesno:'1,' }}"
              data-used-one="{% url 'stock:log_used_one' tile.id %}"
              data-used-last="{% url 'stock:log_used_last' tile.id %}"
              data-running-low="{% url 'stock:log_running_low' tile.id %}"
              data-count-sheet="{% url 'stock:item_count_sheet' tile.id %}"
              class="flex min-h-28 flex-col items-start justify-between gap-1 border border-l-[5px] border-gray-300 border-l-status-{{ tile.status_color }} bg-gray-100 py-3 pr-3 pl-3 text-left transition-colors hover:bg-gray-200 active:bg-gray-300">
        <span class="font-heading text-lg leading-tight font-semibold text-gray-900">{{ tile.name }}</span>
        <span class="text-sm leading-snug text-gray-600">
          {{ tile.qty }}
          {# Green text is too faint on the grey tile, so "On order" stays grey. #}
          {% if tile.status_label %}<span class="block font-semibold {% if tile.status_color == 'ok' %}text-gray-700{% else %}text-status-{{ tile.status_color }}{% endif %}">{{ tile.status_label }}</span>{% endif %}
        </span>
      </button>
    {% endfor %}
  </div>
  <p id="no-match" hidden class="py-10 text-center text-gray-600">No items match your search.</p>
{% else %}
  <p class="blueprint p-5 text-center text-gray-600">No items yet. Your manager adds them on the Stock page.</p>
{% endif %}

<template id="capture-sheet">
  <div class="flex items-center gap-3">
    <h2 data-slot="name" class="flex-1"></h2>
    <button type="button" class="btn btn-line" data-close-dialog>Cancel</button>
  </div>
  {# data-capture: app.js adds a client_id and marks the tap for the service worker's offline queue. #}
  <div class="mt-4 flex flex-col gap-2.5" data-capture="{{ request.user.pk }}">
    <button type="button" data-action="usedOne" hx-disabled-elt="this"
            class="btn btn-tonal h-24 w-full flex-col gap-1">
      <span data-slot="used-one" class="text-2xl"></span>
      <span data-slot="change" class="font-sans text-sm font-medium"></span>
    </button>
    <button type="button" data-action="usedLast" hx-disabled-elt="this"
            class="btn btn-fill h-26 w-full flex-col gap-1">
      <span class="text-[1.625rem]">Used the last one</span>
      <span class="font-sans text-sm font-medium">Shelf is empty now</span>
    </button>
    <button type="button" data-action="runningLow" hx-disabled-elt="this"
            class="btn btn-surface h-26 w-full flex-col gap-1">
      <span class="text-[1.625rem]">Running low</span>
      <span class="font-sans text-sm font-medium text-gray-600">Tell the manager we're low</span>
    </button>
  </div>
  <button type="button" data-action="countSheet" data-method="get"
          hx-target="#sheet-content" hx-swap="innerHTML"
          class="btn btn-line mt-2.5 w-full">
    Set exact count
  </button>
</template>

{% endblock %}
